<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registration of Marriage · Wedding Book</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--bg1:#f6f1e6;--bg2:#e4e3cf;--paper:#fbf9f3;--ink:#4a4d3b;--soft:#8c9277;--line:#cdd2bd;--glow:rgba(255,238,190,.75);--shade:rgba(60,64,45,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b2d22;--bg2:#3a3d2c;--paper:#4a4c3a;--ink:#f3efe2;--soft:#c3c8ae;--line:#6b6f55;--glow:rgba(255,226,160,.25);--shade:rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg1:#2b2d22;--bg2:#3a3d2c;--paper:#4a4c3a;--ink:#f3efe2;--soft:#c3c8ae;--line:#6b6f55;--glow:rgba(255,226,160,.25);--shade:rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 75% 10%,var(--glow),transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.veil{position:fixed;inset:-10%;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 45%,transparent 60%),linear-gradient(100deg,transparent 60%,rgba(255,255,255,.2) 75%,transparent 90%);animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(6%) skewX(-4deg)}}
.leaf{position:fixed;right:-5%;bottom:-8%;width:70vmin;height:70vmin;pointer-events:none;opacity:.22;background:radial-gradient(ellipse 12% 30% at 30% 40%,var(--ink),transparent),radial-gradient(ellipse 10% 26% at 55% 55%,var(--ink),transparent),radial-gradient(ellipse 9% 22% at 70% 30%,var(--ink),transparent);filter:blur(14px);animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(4deg) translateY(-10px)}}
header{text-align:center;z-index:2;padding:10px 16px 0}
header small{letter-spacing:.35em;text-transform:uppercase;font-size:.72rem;color:var(--soft)}
.stage{position:relative;z-index:2;width:min(88vw,460px);height:min(68vh,620px);perspective:1600px;margin:10px 0}
.page{position:absolute;inset:0;background:var(--paper);border-radius:4px 14px 14px 4px;box-shadow:0 30px 60px -20px var(--shade),inset 10px 0 18px -8px var(--shade),0 0 0 1px var(--line);transform-origin:left center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;transition:transform .55s cubic-bezier(.6,.05,.3,1),opacity .55s}
.page.out{transform:rotateY(-95deg);opacity:0}
.page.pre{transform:rotateY(60deg);opacity:0;transition:none}
.page.outr{transform:rotateY(60deg);opacity:0}
.page.prel{transform:rotateY(-95deg);opacity:0;transition:none}
.frame{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.frame img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px;box-shadow:0 10px 30px -10px var(--shade);filter:saturate(.92) contrast(.97)}
.cap{margin-top:12px;font-style:italic;font-size:1.15rem;color:var(--ink);width:100%;min-height:1.6em}
input.cap,.edit{background:transparent;border:0;border-bottom:1px dashed var(--line);text-align:center;font:inherit;color:inherit;outline:none}
.pn{font-size:.8rem;letter-spacing:.3em;color:var(--soft);margin-top:6px}
.script{font-family:'Pinyon Script',cursive;font-size:clamp(2.6rem,11vw,3.8rem);line-height:1.05;margin:.2em 0;font-weight:400}
.rule{width:60px;height:1px;background:var(--soft);margin:14px auto;opacity:.6}
.sub{letter-spacing:.3em;text-transform:uppercase;font-size:.8rem;color:var(--soft)}
.hint{font-style:italic;color:var(--soft);font-size:1.05rem;margin-top:18px}
.nav{z-index:2;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;padding:0 12px 10px}
button{font:inherit;color:var(--ink);background:rgba(255,255,255,.45);border:1px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer;backdrop-filter:blur(6px);letter-spacing:.08em;transition:transform .2s,background .2s}
button:hover{background:rgba(255,255,255,.8);transform:translateY(-1px)}
button.round{width:44px;height:44px;padding:0;font-size:1.3rem}
button:disabled{opacity:.35;cursor:default}
.del{position:absolute;top:6px;right:6px;width:30px;height:30px;padding:0;font-size:1rem}
#note{z-index:2;font-size:.9rem;font-style:italic;color:var(--soft);padding:0 16px 8px;text-align:center;min-height:1.2em}
.fx{position:fixed;left:0;top:0;pointer-events:none;z-index:1}
.fx.top{z-index:3}
.heart{width:var(--s);height:var(--s);color:var(--c);animation:up var(--d) ease-in forwards;opacity:0}
@keyframes up{0%{transform:translate(0,0) rotate(-8deg);opacity:0}12%{opacity:.85}50%{transform:translate(var(--x),-50vh) rotate(8deg)}100%{transform:translate(calc(var(--x)*-.6),-105vh) rotate(-6deg);opacity:0}}
.burst{width:var(--s);height:var(--s);color:var(--c);animation:burst 1.4s ease-out forwards}
@keyframes burst{to{transform:translate(var(--bx),var(--by)) scale(.5) rotate(20deg);opacity:0}}
.dove{width:var(--w);height:calc(var(--w)*.62);animation:fly var(--d) linear forwards;filter:drop-shadow(0 6px 8px var(--shade))}
.dove svg{width:100%;height:100%;overflow:visible;animation:bob 1.8s ease-in-out infinite}
@keyframes fly{from{transform:translateX(-12vw) translateY(0)}to{transform:translateX(112vw) translateY(var(--dy))}}
@keyframes bob{50%{transform:translateY(-14px) rotate(-3deg)}}
.wing{transform-origin:62% 70%;animation:flap .5s ease-in-out infinite alternate}
.wing.b{animation-delay:.12s;opacity:.85}
@keyframes flap{from{transform:rotate(14deg) scaleY(1)}to{transform:rotate(-26deg) scaleY(.7)}}
@media (prefers-reduced-motion:reduce){.veil,.leaf,.dove svg,.wing{animation:none}.page{transition:opacity .3s}}
</style>
</head>
<body>
<div class="veil"></div><div class="leaf"></div>
<div class="fx" id="fx"></div>
<header><small>Registration of Marriage</small></header>
<div class="stage" id="stage"><div class="page" id="page"></div></div>
<div id="note"></div>
<div class="nav">
 <button class="round" id="prev" aria-label="Previous page">‹</button>
 <button id="doves">Release the doves</button>
 <button id="add" hidden>Add photos</button>
 <button class="round" id="next" aria-label="Next page">›</button>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>
<div class="fx top" id="fx2"></div>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="heart" viewBox="0 0 32 30"><path d="M16 28C5 20 2 14 2 9a7 7 0 0 1 14-2 7 7 0 0 1 14 2c0 5-3 11-14 19z" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
<symbol id="hearts" viewBox="0 0 32 30"><path d="M16 28C5 20 2 14 2 9a7 7 0 0 1 14-2 7 7 0 0 1 14 2c0 5-3 11-14 19z" fill="currentColor" fill-opacity=".35" stroke="currentColor" stroke-width="1"/></symbol>
</defs></svg>

<script>
const $=s=>document.querySelector(s),fx=$('#fx'),fx2=$('#fx2'),page=$('#page');
let photos=[],idx=0,cover={t:'Our Wedding Book',s:'The registration of marriage'},db=null,assets=null,isOwner=false,busy=false,local=false;
const pick=a=>a[Math.floor(Math.random()*a.length)],rnd=(a,b)=>a+Math.random()*(b-a);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- animations ---------- */
const cols=['#aab38f','#c9cfb4','#e9d9a8','#ffffff','#b9a98a'];
function heart(x,y,cls,vars){const e=document.createElementNS('http://www.w3.org/2000/svg','svg');e.setAttribute('class',cls);e.innerHTML='<use href="#'+(Math.random()<.4?'hearts':'heart')+'"/>';e.style.cssText='position:absolute;left:'+x+'px;top:'+y+'px;'+vars;return e}
function floatHeart(){const s=rnd(14,34);const e=heart(rnd(0,innerWidth),innerHeight+10,'heart',`--s:${s}px;--c:${pick(cols)};--d:${rnd(9,16)}s;--x:${rnd(-40,40)}px`);fx.appendChild(e);setTimeout(()=>e.remove(),17000)}
function burst(x,y){for(let i=0;i<9;i++){const a=rnd(0,6.28),r=rnd(40,110);const e=heart(x,y,'burst',`--s:${rnd(12,24)}px;--c:${pick(cols)};--bx:${Math.cos(a)*r}px;--by:${Math.sin(a)*r-30}px`);fx2.appendChild(e);setTimeout(()=>e.remove(),1500)}}
const doveSVG='<svg viewBox="0 0 80 50"><g fill="#fff" stroke="#c4cbb0" stroke-width="1" stroke-linejoin="round"><path class="wing b" d="M36 26C30 12 38 2 58 0 52 8 52 16 50 26z"/><path d="M6 24c8 0 13-2 17-7 4-5 11-8 18-6l6-6 1 7c5 1 8 4 7 8-2 4-7 5-11 4 0 8-8 16-20 16-9 0-16-6-18-16z"/><path d="M60 32c8 2 14 8 18 16-9-2-14-4-20-8z"/><path class="wing" d="M34 28C26 12 36-2 62-4 54 6 54 16 52 28z"/></g><circle cx="49" cy="14" r="1.2" fill="#6b6f55"/></svg>';
function dove(){const e=document.createElement('div');e.className='dove';const w=rnd(70,130);e.style.cssText=`position:absolute;left:0;top:${rnd(8,60)}vh;--w:${w}px;--d:${rnd(9,15)}s;--dy:${rnd(-18,10)}vh`;e.innerHTML=doveSVG;fx.appendChild(e);setTimeout(()=>e.remove(),16000)}
function release(){for(let i=0;i<5;i++)setTimeout(dove,i*450);for(let i=0;i<12;i++)setTimeout(floatHeart,i*120)}
setInterval(floatHeart,1400);setInterval(dove,8000);setTimeout(dove,900);for(let i=0;i<5;i++)setTimeout(floatHeart,i*300);
$('#doves').onclick=release;
document.addEventListener('pointerdown',e=>{if(!e.target.closest('button,input'))burst(e.clientX,e.clientY)});

/* ---------- book ---------- */
const total=()=>photos.length+2;
function content(){
 if(idx===0)return `<div class="sub">Together with their families</div><div class="rule"></div>
  <div class="script" id="ct" ${isOwner?'contenteditable="true"':''}>${esc(cover.t)}</div>
  <div class="sub" id="cs" ${isOwner?'contenteditable="true"':''}>${esc(cover.s)}</div><div class="rule"></div>
  <div class="hint">${photos.length?'Turn the page ›':isOwner?'Tap “Add photos” to begin your book':'Photos will appear here soon'}</div>`;
 if(idx===total()-1)return `<div class="script">With love</div><div class="rule"></div><div class="sub">Thank you for celebrating with us</div><div class="hint">‹ Back to the beginning</div>`;
 const p=photos[idx-1];
 return `<div class="frame"><img src="${esc(p.url)}" alt="Wedding photo ${idx}">${isOwner?'<button class="del" title="Remove photo">✕</button>':''}</div>
  ${isOwner?`<input class="cap" placeholder="Add a caption…" value="${esc(p.caption)}">`:`<div class="cap">${esc(p.caption)}</div>`}
  <div class="pn">${idx} / ${photos.length}</div>`;
}
function bind(){
 const ct=$('#ct'),cs=$('#cs');
 if(ct&&db)[ct,cs].forEach(el=>el.onblur=()=>{cover={t:ct.textContent.trim()||cover.t,s:cs.textContent.trim()};db.doc('meta/cover').set(cover).catch(()=>{})});
 const del=page.querySelector('.del');if(del)del.onclick=async()=>{const p=photos[idx-1];try{if(p.ref)await p.ref.delete();else photos.splice(idx-1,1)}catch(e){note('Could not remove photo.')}if(idx>total()-1)idx=total()-1;draw()};
 const ci=page.querySelector('input.cap');if(ci)ci.onchange=()=>{const p=photos[idx-1];p.caption=ci.value;if(p.ref)p.ref.set({assetId:p.assetId,order:p.order,caption:ci.value}).catch(()=>{})};
}
function draw(){page.innerHTML=content();bind();$('#prev').disabled=idx===0;$('#next').disabled=idx>=total()-1}
function go(n,force){
 if(busy||n<0||n>total()-1||(n===idx&&!force))return;busy=true;const d=n>idx;
 page.classList.add(d?'out':'outr');
 setTimeout(()=>{idx=n;draw();page.classList.remove('out','outr');page.classList.add(d?'pre':'prel');void page.offsetWidth;page.classList.remove('pre','prel');setTimeout(()=>busy=false,560)},520);
 burst(innerWidth/2,innerHeight/2);
}
$('#next').onclick=()=>go(idx+1);$('#prev').onclick=()=>go(idx-1);
addEventListener('keydown',e=>{if(e.target.matches('input,[contenteditable]'))return;if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});
let sx=null;$('#stage').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('#stage').addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)go(idx+(dx<0?1:-1));sx=null});
function note(t){$('#note').textContent=t}

/* ---------- uploads ---------- */
async function shrink(f){try{const b=await createImageBitmap(f),k=Math.min(1,1800/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.88))||f}catch(e){return f}}
$('#add').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
 const fs=[...e.target.files];e.target.value='';let n=0;
 for(const f of fs){note(`Adding photo ${++n} of ${fs.length}…`);const b=await shrink(f);
  try{
   if(assets&&db){const a=await assets.upload(b);await db.collection('photos').add({assetId:a.id,order:Date.now()+n,caption:''})}
   else{photos.push({url:URL.createObjectURL(b),caption:'',order:Date.now()});}
  }catch(err){note('A photo could not be uploaded. Please try again.');}
 }
 if(!db){draw()}note(fs.length?'Photos added ♡':'');setTimeout(()=>note(local?'Preview only: sign in to keep your photos in the book.':''),2500);
 if(photos.length&&idx===0)go(1);else draw();release();
};

/* ---------- live data ---------- */
(async()=>{
 draw();
 try{
  const u=await claude.use('user');isOwner=!!(u&&u.canEdit&&u.canEdit());
  db=await claude.use('db');assets=await claude.use('assets');
 }catch(e){}
 if(!db){local=true;isOwner=true;$('#add').hidden=false;note('Preview only: sign in to keep your photos in the book.');draw();return}
 $('#add').hidden=!(isOwner&&assets);
 db.doc('meta/cover').onSnapshot(s=>{if(s.exists){cover=Object.assign(cover,s.data());if(idx===0&&!page.querySelector('[contenteditable]:focus'))draw()}},()=>{});
 db.collection('photos').orderBy('order','asc').onSnapshot(snap=>{
  photos=snap.docs.map(d=>{const v=d.data();return{ref:d.ref||db.doc('photos/'+d.id),assetId:v.assetId,order:v.order,caption:v.caption||'',url:'/_blob/'+v.assetId}});
  if(idx>total()-1)idx=total()-1;
  if(!document.activeElement||!document.activeElement.matches('input,[contenteditable]'))draw();
 },()=>note('Could not load the photos right now.'));
})();
</script>
</body>
</html>
